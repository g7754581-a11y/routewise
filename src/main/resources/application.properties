# ====================================================================
# RouteWise - Smart Bus Ticket Booking & Route Optimization System
# ====================================================================

spring.application.name=routewise
server.port=8085

# Database Configuration (MySQL 8)
spring.datasource.url=jdbc:mysql://localhost:3306/routewise_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Static resources & Web (no-cache for instant updates)
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# Logging
logging.level.com.routewise=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
